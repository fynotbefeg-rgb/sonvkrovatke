# Roman Reels — сборка темы в облаке и выгрузка в «Готовые работы» (ручной запуск).
# Версия ветки claude/reels-videophone-footage-xdoy8a: запускать «Use workflow from» этой ветки.
# Исходники скачиваются по ID файлов Google Диска (файлы открыты по ссылке): токен roman-drive
# видит только свои файлы. Три ролика (хук 1–3 + основа) рендерятся и через rclone
# (секрет RCLONE_CONFIG, remote roman-drive) загружаются в папку «Готовые работы».
# Ролики не сохраняются как artifact: репозиторий публичный.
name: Roman Reels — сборка темы → Готовые работы

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема из RomanReel.tsx (например mctiktok)"
        required: true
        default: "mctiktok"
      hooks:
        description: "ID файлов Google Диска: хук 1,хук 2,хук 3"
        required: true
      body:
        description: "ID файла основы"
        required: true
      screen:
        description: "ID записи экрана ManyChat TikTok (для темы mctiktok)"
        required: false
        default: ""
      out_prefix:
        description: "Начало имени готовых файлов"
        required: true
        default: "Roman-ManyChat-TikTok-BOT"

permissions:
  contents: read

concurrency:
  group: roman-reels-render-${{ github.ref }}
  cancel-in-progress: false

env:
  DONE_FOLDER: 118fywgyvKvd4Pf6XHW5i3dwN4HPJ8fdN # «Готовые работы»

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: roman-reels/pv
    env:
      TOPIC: ${{ inputs.topic }}
      HOOKS: ${{ inputs.hooks }}
      BODY: ${{ inputs.body }}
      SCREEN: ${{ inputs.screen }}
      PREFIX: ${{ inputs.out_prefix }}
    steps:
      - name: Проверка параметров и секрета
        working-directory: .
        env:
          HAS_RCLONE: ${{ secrets.RCLONE_CONFIG != '' }}
        run: |
          [[ "$TOPIC" =~ ^[a-z0-9_]+$ ]] || { echo "::error::Недопустимая тема"; exit 1; }
          for id in ${HOOKS//,/ } $BODY $SCREEN; do
            [[ "$id" =~ ^[A-Za-z0-9_-]{20,}$ ]] || { echo "::error::Недопустимый ID файла"; exit 1; }
          done
          [[ "$PREFIX" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Недопустимый префикс"; exit 1; }
          [ "$HAS_RCLONE" = "true" ] || { echo "::error::Нет секрета RCLONE_CONFIG"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roman-reels/pv/package-lock.json

      - name: npm ci
        run: npm ci

      - name: rclone и ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone ffmpeg
          rclone version | head -1; ffmpeg -version | head -1

      - name: Конфиг rclone из секрета
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          umask 077
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$RUNNER_TEMP/rclone.conf"
          grep -q '^\[roman-drive\]' "$RUNNER_TEMP/rclone.conf" || { echo "::error::В RCLONE_CONFIG нет remote roman-drive"; exit 1; }

      - name: Скачивание исходников по ссылкам
        run: |
          set -euo pipefail
          get() { # id файл — Drive отдаёт файл, открытый по ссылке; проверяем, что это видео
            curl -fsSL --retry 3 -o "$2" "https://drive.usercontent.google.com/download?id=$1&export=download&confirm=t"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$2" \
              || { echo "::error::Файл $1 не скачался как видео (закрыт доступ по ссылке?)"; exit 1; }
          }
          dir="public/rr/$TOPIC"; mkdir -p "$dir" public/ai
          IFS=',' read -r h1 h2 h3 <<< "$HOOKS"
          get "$h1" "$dir/h1.mp4"; get "$h2" "$dir/h2.mp4"; get "$h3" "$dir/h3.mp4"
          get "$BODY" "$dir/osnova.mp4"
          if [ "$TOPIC" = "mctiktok" ]; then
            [ -n "$SCREEN" ] || { echo "::error::Для mctiktok нужен ID записи экрана"; exit 1; }
            get "$SCREEN" "$RUNNER_TEMP/screen.mp4"
            bash ../scripts/cut-tiktok-clips.sh "$RUNNER_TEMP/screen.mp4" public/ai
          fi
          ls -l "$dir"

      - name: Браузер для Remotion
        run: npx remotion browser ensure

      - name: Рендер трёх версий
        run: |
          set -euo pipefail
          mkdir -p out
          for h in 1 2 3; do
            npx remotion render "R-$TOPIC-h$h" "out/raw-h$h.mp4" --codec=h264 --crf=16 \
              --audio-codec=aac --audio-bitrate=192k --concurrency=4 --log=error
            ffmpeg -nostdin -v error -y -i "out/raw-h$h.mp4" -af loudnorm=I=-14:TP=-1.5:LRA=11 \
              -c:v libx264 -b:v 2500k -maxrate 3000k -bufsize 5000k -preset slow \
              -c:a aac -b:a 160k -ar 48000 -movflags +faststart "out/$PREFIX-hook$h.mp4"
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height \
              -of csv=p=0 "out/$PREFIX-hook$h.mp4"
          done

      - name: Загрузка в «Готовые работы»
        run: |
          set -euo pipefail
          rc() { rclone --config "$RUNNER_TEMP/rclone.conf" --drive-root-folder-id "$DONE_FOLDER" --retries 3 --log-level NOTICE "$@"; }
          for h in 1 2 3; do
            rc copyto "out/$PREFIX-hook$h.mp4" "roman-drive:$PREFIX-hook$h.mp4"
            rc lsf roman-drive: --files-only | grep -Fx "$PREFIX-hook$h.mp4"
          done
          echo "Готово: 3 файла в «Готовые работы»"

      - name: Удаление конфига
        if: always()
        run: rm -f "$RUNNER_TEMP/rclone.conf"
