# Roman Reels — тестовый рендер одной композиции в облаке (этап 2).
# Только ручной запуск. Исходники качаются из Google Drive через rclone
# (сервисный аккаунт, только чтение), результат — artifact GitHub Actions.
# Доступ к Drive задаётся секретом GDRIVE_SA_JSON и переменной ROMAN_ASSETS_FOLDER_ID;
# пока они не заданы, workflow останавливается на первом шаге и ничего не рендерит.
name: Roman Reels — тестовый рендер (ручной запуск)

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Композиция, например R-manychat-h1"
        required: true
        default: "R-manychat-h1"
      upload_to_drive:
        description: "Загрузить MP4 в личный Google Drive после рендера (нужна OAuth-настройка)"
        required: true
        type: boolean
        default: false
      mode:
        description: "check-sources — только скачать и проверить исходники; render — плюс рендер и artifact"
        required: true
        type: choice
        options:
          - check-sources
          - render
        default: check-sources

permissions:
  contents: read

concurrency:
  group: roman-reels-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: roman-reels/pv
    env:
      COMPOSITION: ${{ inputs.composition }}
      MODE: ${{ inputs.mode }}
    steps:
      - name: Доступ к Google Drive настроен?
        working-directory: .
        env:
          HAS_SA: ${{ secrets.GDRIVE_SA_JSON != '' }}
          FOLDER_ID: ${{ vars.ROMAN_ASSETS_FOLDER_ID }}
        run: |
          if [[ ! "$COMPOSITION" =~ ^R-[a-z0-9_]+-h[123](-ph)?$ ]]; then
            echo "::error::Недопустимое имя композиции: $COMPOSITION (ожидается R-<тема>-h1|h2|h3)"; exit 1
          fi
          if [ "$HAS_SA" != "true" ] || [ -z "$FOLDER_ID" ]; then
            echo "::error::Доступ к Google Drive ещё не настроен: нужен секрет GDRIVE_SA_JSON и переменная ROMAN_ASSETS_FOLDER_ID (см. roman-reels/CLOUD_RENDER.md). Рендер не запускался."
            exit 1
          fi
          echo "Композиция: $COMPOSITION, режим: $MODE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roman-reels/pv/package-lock.json

      - name: Установка зависимостей (npm ci)
        run: npm ci

      - name: Установка rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          rclone version | head -1

      - name: Список исходников для скачивания
        run: |
          node scripts/check-assets.mjs "$COMPOSITION" --list > "$RUNNER_TEMP/needed.txt"
          : > "$RUNNER_TEMP/download.txt"
          while IFS= read -r p; do
            [ -s "public/$p" ] || echo "$p" >> "$RUNNER_TEMP/download.txt"
          done < "$RUNNER_TEMP/needed.txt"
          echo "Будет скачано с Google Drive:"
          cat "$RUNNER_TEMP/download.txt"

      - name: Скачивание исходников с Google Drive (только чтение)
        env:
          RCLONE_CONFIG: ${{ runner.temp }}/rclone-empty.conf
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.readonly
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ vars.ROMAN_ASSETS_FOLDER_ID }}
        run: |
          : > "$RCLONE_CONFIG"
          if [ ! -s "$RUNNER_TEMP/download.txt" ]; then echo "Скачивать нечего"; exit 0; fi
          echo "Проверяем доступность корня Google Drive:"
          rclone lsf gdrive: --dirs-only --max-depth 2 || { echo "::error::Не удалось прочитать папку Google Drive"; exit 1; }
          echo "Проверяем папку rr/manychat:"
          # Drive can contain a folder literally named "rr " (with trailing space).
          # Detect it explicitly and translate requested paths to that actual folder.
          source_root="rr"
          if ! rclone lsf "gdrive:rr/manychat" --files-only; then
            echo "Пробуем папку с пробелом в конце имени: 'rr '"
            rclone lsf "gdrive:rr /manychat" --files-only || { echo "::error::Не удалось открыть ни rr/manychat, ни rr /manychat"; exit 1; }
            source_root="rr "
          fi
          if [ "$source_root" = "rr " ]; then
            sed 's@^rr/@rr /@' "$RUNNER_TEMP/download.txt" > "$RUNNER_TEMP/download-drive.txt"
          else
            cp "$RUNNER_TEMP/download.txt" "$RUNNER_TEMP/download-drive.txt"
          fi
          echo "Скачиваем исходники:"
          rclone copy gdrive: public --files-from "$RUNNER_TEMP/download-drive.txt" \
            --retries 3 --stats 20s --stats-one-line --log-level INFO
          if [ "$source_root" = "rr " ]; then
            mkdir -p public/rr
            if [ -d "public/rr /manychat" ]; then
              cp -a "public/rr /manychat/." "public/rr/manychat/"
            fi
          fi
          echo "Проверяем результат скачивания:"
          failed=0
          while IFS= read -r p; do
            if [ -s "public/$p" ]; then
              echo "OK public/$p ($(wc -c < "public/$p") bytes)"
            else
              echo "::error::Файл не скачан: $p"
              failed=1
            fi
          done < "$RUNNER_TEMP/download.txt"
          if [ "$failed" -ne 0 ]; then
            echo "::error::rclone завершился без ошибки, но некоторые исходники отсутствуют. Проверьте список папок и файлов выше."
            exit 1
          fi

      - name: Проверка исходников перед рендером
        run: node scripts/check-assets.mjs "$COMPOSITION"

      - name: Браузер для Remotion
        if: inputs.mode == 'render'
        run: npx remotion browser ensure

      - name: Рендер (исходное качество, без лимита 30 МБ)
        if: inputs.mode == 'render'
        run: npm run render:quality -- "$COMPOSITION"

      - name: Параметры результата
        if: inputs.mode == 'render'
        run: |
          f="out/$COMPOSITION.mp4"
          [ -s "$f" ] || { echo "::error::Нет результата $f"; exit 1; }
          ls -l "$f"
          npx remotion ffprobe -v error \
            -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 "$f"

      - name: Проверка настроек загрузки на Google Drive
        if: inputs.mode == 'render' && inputs.upload_to_drive
        env:
          HAS_RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG != '' }}
        run: |
          if [ "$HAS_RCLONE_CONFIG" != "true" ]; then
            echo "::error::Отсутствует секрет RCLONE_CONFIG"
            exit 1
          fi

      - name: Загрузка MP4 в личный Google Drive без перекодирования
        if: inputs.mode == 'render' && inputs.upload_to_drive
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          set -euo pipefail
          config_file="$RUNNER_TEMP/roman-rclone-upload.conf"
          umask 077
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$config_file"
          unset RCLONE_CONFIG_CONTENT
          if ! grep -q '^\[roman-drive\]' "$config_file"; then
            echo "::error::В RCLONE_CONFIG отсутствует remote roman-drive"
            exit 1
          fi
          rclone --config "$config_file" copyto "out/$COMPOSITION.mp4" "roman-drive:$COMPOSITION.mp4" \
            --drive-root-folder-id 118fywgyvKvd4Pf6XHW5i3dwN4HPJ8fdN \
            --retries 3 --stats 20s --log-level NOTICE
          rclone --config "$config_file" lsf roman-drive: \
            --drive-root-folder-id 118fywgyvKvd4Pf6XHW5i3dwN4HPJ8fdN \
            --files-only | grep -Fx "$COMPOSITION.mp4"
          echo "MP4 загружен и найден в папке Романа"

      - name: Artifact с готовым MP4
        if: inputs.mode == 'render'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.composition }}
          path: roman-reels/pv/out/${{ inputs.composition }}.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
