# Roman Reels — ручная проверка проекта в облаке (этап 1).
# По умолчанию проверка Remotion; отдельные взаимоисключающие режимы
# проверяют доступ к сервисам или выполняют явно согласованный сбор одного Reel.
name: Roman Reels — проверка (ручной запуск)

on:
  workflow_dispatch:
    inputs:
      run_claude_task:
        description: "Claude Code: прочитать задание 01 и подготовить предложение (расход лимита подписки)"
        required: false
        type: boolean
        default: false
      send_pilot_drafts:
        description: "Отправить 3 подготовленных черновика в Google, без ИИ и производства"
        required: false
        type: boolean
        default: false
      check_google_queue:
        description: "Только чтение очереди Google, без генерации, записи и рендера"
        required: false
        type: boolean
        default: false
      collect_one_apify_reel:
        description: "Платный пробный сбор одного Reel, API-лимит $0.05 (только после согласования)"
        required: false
        type: boolean
        default: false
      apify_reel_url:
        description: "Единственный Reel для пробного сбора"
        required: false
        default: "https://www.instagram.com/reel/Dd-BrltxRS1/"
      check_apify_access:
        description: "Проверить только токен Apify, без Remotion и запуска Actors"
        required: false
        type: boolean
        default: false
      topics:
        description: "Темы через пробел, для которых должны существовать композиции R-<тема>-h1..h3"
        required: false
        default: "manychat startups"

permissions:
  contents: read

concurrency:
  group: roman-reels-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claude-task:
    if: inputs.run_claude_task && !inputs.check_google_queue && !inputs.send_pilot_drafts && !inputs.check_apify_access && !inputs.collect_one_apify_reel && github.ref == 'refs/heads/automation/roman-reels-v1'
    uses: ./.github/workflows/roman-claude-task.yml
    with:
      enabled: ${{ vars.ROMAN_CLAUDE_ENABLED == 'true' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  google-queue:
    if: (inputs.check_google_queue || inputs.send_pilot_drafts) && !inputs.run_claude_task && !inputs.check_apify_access && !inputs.collect_one_apify_reel && github.ref == 'refs/heads/automation/roman-reels-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read authenticated Google queue (no production)
        env:
          ROMAN_REELS_WEBHOOK_URL: ${{ secrets.ROMAN_REELS_WEBHOOK_URL }}
          ROMAN_REELS_WEBHOOK_TOKEN: ${{ secrets.ROMAN_REELS_WEBHOOK_TOKEN }}
        run: node roman-reels/scripts/check-production-queue.mjs "$RUNNER_TEMP/approvals.json"
      - name: Validate pending pilot (offline)
        if: inputs.send_pilot_drafts
        run: node roman-reels/scripts/validate-approvals.mjs roman-reels/research/roman-pilot-drafts.json
      - name: Send three pending pilot drafts (no generation or approval)
        if: inputs.send_pilot_drafts
        env:
          ROMAN_REELS_WEBHOOK_URL: ${{ secrets.ROMAN_REELS_WEBHOOK_URL }}
          ROMAN_REELS_WEBHOOK_TOKEN: ${{ secrets.ROMAN_REELS_WEBHOOK_TOKEN }}
        run: node roman-reels/scripts/send-drafts-to-sheet.mjs roman-reels/research/roman-pilot-drafts.json
  one-reel:
    if: inputs.collect_one_apify_reel && !inputs.run_claude_task && !inputs.check_apify_access && !inputs.check_google_queue && !inputs.send_pilot_drafts && github.ref == 'refs/heads/automation/roman-reels-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Budget and scope tests (offline)
        run: node --test roman-reels/scripts/apify-one-reel.test.mjs
      - name: Collect exactly one Reel with API cost cap
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ONE_REEL_APPROVED: 'true'
          REEL_URL: ${{ inputs.apify_reel_url }}
        run: node roman-reels/scripts/apify-one-reel.mjs "$REEL_URL" "$RUNNER_TEMP/one-reel.json" run
      - name: Preserve metadata and remote run ID for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-apify-one-reel
          path: |
            ${{ runner.temp }}/one-reel.json
            ${{ runner.temp }}/one-reel.json.run.json
          if-no-files-found: ignore
          retention-days: 3
  apify:
    if: inputs.check_apify_access && !inputs.run_claude_task && !inputs.collect_one_apify_reel && !inputs.check_google_queue && !inputs.send_pilot_drafts && github.ref == 'refs/heads/automation/roman-reels-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apify safety tests (offline)
        run: node --test roman-reels/scripts/apify-access.test.mjs
      - name: Apify account access (read only, no Actor runs)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node roman-reels/scripts/check-apify-access.mjs
  check:
    if: ${{ !inputs.run_claude_task && !inputs.check_apify_access && !inputs.collect_one_apify_reel && !inputs.check_google_queue && !inputs.send_pilot_drafts }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: roman-reels/pv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roman-reels/pv/package-lock.json

      - name: Установка зависимостей (npm ci)
        run: npm ci

      - name: Синтаксис скриптов
        run: |
          for f in scripts/*.mjs; do
            node --check "$f"
            echo "ok: $f"
          done

      - name: Проверки аргументов скриптов (без рендера и загрузки)
        run: |
          set +e
          node scripts/render-topic.mjs __unknown_topic__ ; rc=$?
          [ "$rc" -eq 2 ] || { echo "render-topic: ожидался код 2, получен $rc"; exit 1; }
          node scripts/render-quality.mjs not-a-composition ; rc=$?
          [ "$rc" -eq 2 ] || { echo "render-quality: ожидался код 2, получен $rc"; exit 1; }
          env -u ROMAN_DRIVE_REMOTE node scripts/upload-topic.mjs manychat ; rc=$?
          [ "$rc" -eq 2 ] || { echo "upload-topic: ожидался код 2, получен $rc"; exit 1; }
          echo "Проверки аргументов пройдены"

      - name: Браузер для Remotion (Chrome Headless Shell)
        run: npx remotion browser ensure

      - name: Список композиций Remotion
        run: npx remotion compositions src/index.ts | tee compositions.txt

      - name: Проверка обязательных композиций
        env:
          TOPICS: ${{ inputs.topics }}
        run: |
          missing=0
          for t in $TOPICS; do
            case "$t" in *[!a-z0-9_-]*) echo "Недопустимое имя темы: $t"; exit 1;; esac
            for h in h1 h2 h3; do
              id="R-$t-$h"
              if grep -Eq "(^|[[:space:]])$id[[:space:]]" compositions.txt; then
                echo "ok: $id"
              else
                echo "НЕТ композиции: $id"; missing=1
              fi
            done
          done
          exit $missing

      - name: Сохранить список композиций
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-reels-compositions
          path: roman-reels/pv/compositions.txt
          if-no-files-found: ignore
          retention-days: 7
