# Roman Reels — ручная проверка проекта в облаке (этап 1).
# По умолчанию проверка Remotion; отдельные взаимоисключающие режимы
# проверяют доступ к сервисам или выполняют явно согласованный сбор одного Reel.
name: Roman Reels — проверка (ручной запуск)

on:
  workflow_dispatch:
    inputs:
      check_drive_intake_access:
        description: 'Read-only incoming access check using existing Drive OAuth; no generation'
        type: boolean
        default: false
      inspect_saved_apify:
        description: 'Inspect media from saved run 38041968344; no Actors or service calls'
        type: boolean
        default: false
      read_saved_apify:
        description: 'Read existing research run 38041724125 only; no Actor creation'
        type: boolean
        default: false
      apify_reference_research:
        description: 'Approved $1 probe: metadata or selected transcript/video (feature branch only)'
        type: boolean
        default: false
      apify_reference_stage:
        type: choice
        options: [metadata, details]
        default: metadata
      apify_reference_urls:
        description: 'For details: 1–2 selected Instagram Reel URLs separated by spaces'
        default: ''
      test_production_queue:
        description: "Offline-проверки Telegram-кнопки и смены ручного/Windows этапа, без сервисов"
        required: false
        type: boolean
        default: false
      run_claude_task:
        description: "Claude Code: прочитать задание 01 и подготовить предложение (расход лимита подписки)"
        required: false
        type: boolean
        default: false
      send_pilot_drafts:
        description: "Отправить 3 подготовленных черновика в Google, без ИИ и производства"
        required: false
        type: boolean
        default: false
      check_google_queue:
        description: "Только чтение очереди Google, без генерации, записи и рендера"
        required: false
        type: boolean
        default: false
      collect_one_apify_reel:
        description: "Платный пробный сбор одного Reel, API-лимит $0.05 (только после согласования)"
        required: false
        type: boolean
        default: false
      apify_reel_url:
        description: "Единственный Reel для пробного сбора"
        required: false
        default: "https://www.instagram.com/reel/Dd-BrltxRS1/"
      check_apify_access:
        description: "Проверить только токен Apify, без Remotion и запуска Actors"
        required: false
        type: boolean
        default: false
      topics:
        description: "Темы через пробел, для которых должны существовать композиции R-<тема>-h1..h3"
        required: false
        default: "manychat startups"

permissions:
  contents: read
  actions: read

concurrency:
  group: roman-reels-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drive-intake-access:
    if: inputs.check_drive_intake_access && github.ref == 'refs/heads/feature/codex-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Verify existing Drive credential without exposing it
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          python -m pip install google-auth==2.43.0 requests==2.32.5
          python roman-reels/scripts/check-drive-intake-access.py
      - uses: actions/upload-artifact@v4
        with:
          name: roman-drive-intake-access
          path: ${{ runner.temp }}/drive-intake-access.json
          retention-days: 7
  inspect-saved-apify:
    if: inputs.inspect_saved_apify && github.ref == 'refs/heads/feature/codex-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: roman-apify-reference-details
          run-id: 38041968344
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saved-media
      - name: Install media inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Inspect downloaded files without service credentials
        run: python roman-reels/scripts/inspect-apify-media.py
  read-saved-apify:
    if: inputs.read_saved_apify && github.ref == 'refs/heads/feature/codex-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: roman-apify-reference-metadata
          run-id: 38041724125
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saved-research
      - name: Read existing datasets only
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node roman-reels/scripts/read-saved-apify.mjs
  reference-research:
    if: inputs.apify_reference_research && github.ref == 'refs/heads/feature/codex-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Budget and identity tests
        run: node --test roman-reels/scripts/apify-reference-research.test.mjs
      - name: Bounded research (owner approved aggregate $1)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_RESEARCH_APPROVED: 'true'
          RESEARCH_STAGE: ${{ inputs.apify_reference_stage }}
          RESEARCH_URLS: ${{ inputs.apify_reference_urls }}
        run: |
          read -r -a selected_urls <<< "$RESEARCH_URLS"
          node roman-reels/scripts/apify-reference-research.mjs "$RESEARCH_STAGE" "$RUNNER_TEMP/reference-research" "${selected_urls[@]}"
      - name: Report verified public details and run status
        if: always()
        env:
          RESEARCH_DIRECTORY: ${{ runner.temp }}/reference-research
        run: node roman-reels/scripts/report-apify-research.mjs
      - name: Preserve run journals, research and selected media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-apify-reference-${{ inputs.apify_reference_stage }}
          path: ${{ runner.temp }}/reference-research/
          if-no-files-found: ignore
          retention-days: 3
  production-queue-tests:
    if: inputs.test_production_queue && !inputs.run_claude_task && !inputs.check_google_queue && !inputs.send_pilot_drafts && !inputs.check_apify_access && !inputs.collect_one_apify_reel && github.ref == 'refs/heads/automation/roman-reels-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline queue and manual intake checks
        run: |
          node roman-reels/scripts/production-queue.test.mjs
          node roman-reels/scripts/manual-intake.test.mjs
  claude-task:
    if: inputs.run_claude_task && !inputs.test_production_queue && !inputs.check_google_queue && !inputs.send_pilot_drafts && !inputs.check_apify_access && !inputs.collect_one_apify_reel && github.ref == 'refs/heads/automation/roman-reels-v1'
    uses: ./.github/workflows/roman-claude-task.yml
    with:
      enabled: ${{ vars.ROMAN_CLAUDE_ENABLED == 'true' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  google-queue:
    if: (inputs.check_google_queue || inputs.send_pilot_drafts) && !inputs.test_production_queue && !inputs.run_claude_task && !inputs.check_apify_access && !inputs.collect_one_apify_reel && github.ref == 'refs/heads/automation/roman-reels-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read authenticated Google queue (no production)
        env:
          ROMAN_REELS_WEBHOOK_URL: ${{ secrets.ROMAN_REELS_WEBHOOK_URL }}
          ROMAN_REELS_WEBHOOK_TOKEN: ${{ secrets.ROMAN_REELS_WEBHOOK_TOKEN }}
        run: node roman-reels/scripts/check-production-queue.mjs "$RUNNER_TEMP/approvals.json"
      - name: Validate pending pilot (offline)
        if: inputs.send_pilot_drafts
        run: node roman-reels/scripts/validate-approvals.mjs roman-reels/research/roman-pilot-drafts.json
      - name: Send three pending pilot drafts (no generation or approval)
        if: inputs.send_pilot_drafts
        env:
          ROMAN_REELS_WEBHOOK_URL: ${{ secrets.ROMAN_REELS_WEBHOOK_URL }}
          ROMAN_REELS_WEBHOOK_TOKEN: ${{ secrets.ROMAN_REELS_WEBHOOK_TOKEN }}
        run: node roman-reels/scripts/send-drafts-to-sheet.mjs roman-reels/research/roman-pilot-drafts.json
  one-reel:
    if: inputs.collect_one_apify_reel && !inputs.test_production_queue && !inputs.run_claude_task && !inputs.check_apify_access && !inputs.check_google_queue && !inputs.send_pilot_drafts && github.ref == 'refs/heads/automation/roman-reels-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Budget and scope tests (offline)
        run: node --test roman-reels/scripts/apify-one-reel.test.mjs
      - name: Collect exactly one Reel with API cost cap
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ONE_REEL_APPROVED: 'true'
          REEL_URL: ${{ inputs.apify_reel_url }}
        run: node roman-reels/scripts/apify-one-reel.mjs "$REEL_URL" "$RUNNER_TEMP/one-reel.json" run
      - name: Preserve metadata and remote run ID for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-apify-one-reel
          path: |
            ${{ runner.temp }}/one-reel.json
            ${{ runner.temp }}/one-reel.json.run.json
          if-no-files-found: ignore
          retention-days: 3
  apify:
    if: inputs.check_apify_access && !inputs.test_production_queue && !inputs.run_claude_task && !inputs.collect_one_apify_reel && !inputs.check_google_queue && !inputs.send_pilot_drafts && github.ref == 'refs/heads/automation/roman-reels-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apify safety tests (offline)
        run: node --test roman-reels/scripts/apify-access.test.mjs
      - name: Apify account access (read only, no Actor runs)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node roman-reels/scripts/check-apify-access.mjs
  check:
    if: ${{ !inputs.check_drive_intake_access && !inputs.inspect_saved_apify && !inputs.read_saved_apify && !inputs.apify_reference_research && !inputs.test_production_queue && !inputs.run_claude_task && !inputs.check_apify_access && !inputs.collect_one_apify_reel && !inputs.check_google_queue && !inputs.send_pilot_drafts }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: roman-reels/pv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roman-reels/pv/package-lock.json

      - name: Установка зависимостей (npm ci)
        run: npm ci

      - name: Синтаксис скриптов
        run: |
          for f in scripts/*.mjs; do
            node --check "$f"
            echo "ok: $f"
          done

      - name: Проверки аргументов скриптов (без рендера и загрузки)
        run: |
          set +e
          node scripts/render-topic.mjs __unknown_topic__ ; rc=$?
          [ "$rc" -eq 2 ] || { echo "render-topic: ожидался код 2, получен $rc"; exit 1; }
          node scripts/render-quality.mjs not-a-composition ; rc=$?
          [ "$rc" -eq 2 ] || { echo "render-quality: ожидался код 2, получен $rc"; exit 1; }
          env -u ROMAN_DRIVE_REMOTE node scripts/upload-topic.mjs manychat ; rc=$?
          [ "$rc" -eq 2 ] || { echo "upload-topic: ожидался код 2, получен $rc"; exit 1; }
          echo "Проверки аргументов пройдены"

      - name: Браузер для Remotion (Chrome Headless Shell)
        run: npx remotion browser ensure

      - name: Список композиций Remotion
        run: npx remotion compositions src/index.ts | tee compositions.txt

      - name: Проверка обязательных композиций
        env:
          TOPICS: ${{ inputs.topics }}
        run: |
          missing=0
          for t in $TOPICS; do
            case "$t" in *[!a-z0-9_-]*) echo "Недопустимое имя темы: $t"; exit 1;; esac
            for h in h1 h2 h3; do
              id="R-$t-$h"
              if grep -Eq "(^|[[:space:]])$id[[:space:]]" compositions.txt; then
                echo "ok: $id"
              else
                echo "НЕТ композиции: $id"; missing=1
              fi
            done
          done
          exit $missing

      - name: Сохранить список композиций
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-reels-compositions
          path: roman-reels/pv/compositions.txt
          if-no-files-found: ignore
          retention-days: 7
